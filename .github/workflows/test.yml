name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: job-watcher-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Tests and Docker builds
    runs-on: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "Linux", "X64", "job-watcher"]') || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - name: Install browser test runtime
        run: python -m playwright install chromium
      - name: Install browser dependencies on hosted PR runner
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: python -m playwright install-deps chromium
      - run: python -m pytest -q --junitxml=pytest-report.xml
        continue-on-error: true
        env:
          RUN_UI_TESTS: '1'
      - name: Report pytest failures
        if: always()
        run: python scripts/report_pytest_failures.py pytest-report.xml
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
      - name: Build app and browser images
        env:
          APP_ACCESS_TOKEN: ci-build-only
        run: |
          cp .env.example .env
          docker compose build watcher jobteaser-browser
  deploy:
    name: Deploy to home server
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOYMENT_ENABLED == 'true'
    runs-on: [self-hosted, Linux, X64, job-watcher]
    timeout-minutes: 25
    environment: production
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy and verify health
        run: bash scripts/deploy.sh
