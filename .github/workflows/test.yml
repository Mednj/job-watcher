name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: job-watcher-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Tests and Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
        env:
          RUN_UI_TESTS: '1'
      - name: Build app and browser images
        env:
          APP_ACCESS_TOKEN: ci-build-only
        run: |
          cp .env.example .env
          docker compose build watcher jobteaser-browser
  deploy:
    name: Deploy to home server
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOYMENT_ENABLED == 'true'
    runs-on: [self-hosted, Linux, X64, job-watcher]
    timeout-minutes: 25
    environment: production
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy and verify health
        run: bash scripts/deploy.sh
